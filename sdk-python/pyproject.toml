[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hjs"
version = "0.2.0"
description = "Python client for the hjs stealth headless browser (Mojo + QuickJS)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Amirhossein Sadeghi"}]
keywords = ["scraper", "headless", "stealth", "quickjs", "crawler"]

[project.urls]
Homepage = "https://github.com/ahurkkkkkkk/hjs"

[tool.setuptools]
py-modules = ["hjs"]
