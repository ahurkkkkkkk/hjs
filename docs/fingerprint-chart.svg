<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">TLS JA4 fingerprint as seen by tls.peet.ws (real handshake, same box)</text>
  <text x="24" y="50" font-size="11" fill="#8b949e">A server gating on TLS will classify the top two rows as non-browsers. Splugin and curl_cffi match real Chrome JA4 exactly.</text>

  <g font-size="12">
    <!-- rows: label bar value -->
    <text x="150" y="86" text-anchor="end" fill="#57606a">hjs (libcurl/OpenSSL)</text>
    <rect x="160" y="72" width="200" height="20" rx="3" fill="#cf222e"/>
    <text x="368" y="86" fill="#1f2328" font-family="ui-monospace, Menlo, monospace">t13d3112h2_e8f1e7e78f70 ...</text>
    <text x="690" y="86" text-anchor="end" fill="#cf222e">NOT a browser</text>

    <text x="150" y="126" text-anchor="end" fill="#57606a">python requests</text>
    <rect x="160" y="112" width="200" height="20" rx="3" fill="#cf222e"/>
    <text x="368" y="126" fill="#1f2328" font-family="ui-monospace, Menlo, monospace">t13d3112h1_e8f1e7e78f70 ...</text>
    <text x="690" y="126" text-anchor="end" fill="#cf222e">NOT a browser</text>

    <text x="150" y="166" text-anchor="end" fill="#57606a">Splugin chrome_131</text>
    <rect x="160" y="152" width="280" height="20" rx="3" fill="#2da44e"/>
    <text x="448" y="166" fill="#1f2328" font-family="ui-monospace, Menlo, monospace">t13d1516h2_8daaf6152771</text>
    <text x="690" y="166" text-anchor="end" fill="#2da44e">= Chrome</text>

    <text x="150" y="206" text-anchor="end" fill="#57606a">curl_cffi chrome131</text>
    <rect x="160" y="192" width="280" height="20" rx="3" fill="#2da44e"/>
    <text x="448" y="206" fill="#1f2328" font-family="ui-monospace, Menlo, monospace">t13d1516h2_8daaf6152771</text>
    <text x="690" y="206" text-anchor="end" fill="#2da44e">= Chrome</text>

    <text x="150" y="246" text-anchor="end" fill="#57606a">Splugin firefox_133</text>
    <rect x="160" y="232" width="230" height="20" rx="3" fill="#0969da"/>
    <text x="398" y="246" fill="#1f2328" font-family="ui-monospace, Menlo, monospace">t13d1714h2_5b57614c22b0</text>
    <text x="690" y="246" text-anchor="end" fill="#0969da">= Firefox</text>

    <text x="150" y="286" text-anchor="end" fill="#57606a">Splugin safari_16_0</text>
    <rect x="160" y="272" width="230" height="20" rx="3" fill="#8250df"/>
    <text x="398" y="286" fill="#1f2328" font-family="ui-monospace, Menlo, monospace">t13d2014h2_a09f3c656075</text>
    <text x="690" y="286" text-anchor="end" fill="#8250df">= Safari</text>
  </g>
  <text x="160" y="326" font-size="11" fill="#8b949e">15=15 cipher suites / 16 extensions / h2 ALPN: the Splugin bar equals the curl_cffi bar byte for byte.</text>
  <text x="160" y="344" font-size="10" fill="#b1bac4">Full data in docs/bench-results.json, generated by sdk-python/bench_splugin.py.</text>
</svg>
